<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="雅利洛六号雪原与贝洛伯格插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050c"/>
      <stop offset=".5" stop-color="#0a1c2e"/>
      <stop offset="1" stop-color="#134158"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd4c0" stop-opacity="0"/>
      <stop offset=".4" stop-color="#4fe0c8" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#8ad8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b6cf0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#dceaf7"/>
      <stop offset="1" stop-color="#93b4cc"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41597a"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6dcee"/>
      <stop offset="1" stop-color="#5f83a3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a672c"/>
      <stop offset=".5" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#8a672c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="70" r="1.4" opacity=".8"/><circle cx="140" cy="118" r="1" opacity=".5"/>
    <circle cx="214" cy="52" r="1.2" opacity=".6"/><circle cx="286" cy="96" r="1.6" opacity=".8"/>
    <circle cx="352" cy="44" r="1" opacity=".5"/><circle cx="430" cy="110" r="1.2" opacity=".6"/>
    <circle cx="500" cy="50" r="1.4" opacity=".7"/><circle cx="570" cy="150" r="1" opacity=".45"/>
    <circle cx="720" cy="52" r="1.5" opacity=".75"/><circle cx="770" cy="180" r="1" opacity=".45"/>
    <circle cx="92" cy="212" r="1.1" opacity=".5"/><circle cx="180" cy="260" r="1" opacity=".4"/>
    <circle cx="740" cy="286" r="1.2" opacity=".5"/><circle cx="48" cy="330" r="1" opacity=".35"/>
  </g>

  <g filter="url(#soft)">
    <path d="M-40 168 C 140 74 250 210 420 122 S 690 44 840 138" fill="none" stroke="url(#aurora)" stroke-width="42" opacity=".65"/>
    <path d="M-40 236 C 160 150 280 268 460 186 S 720 116 840 210" fill="none" stroke="url(#aurora)" stroke-width="26" opacity=".4"/>
  </g>

  <g>
    <circle cx="646" cy="112" r="54" fill="url(#moon)"/>
    <g fill="#b9d0e2" opacity=".55">
      <circle cx="628" cy="98" r="9"/><circle cx="662" cy="120" r="6"/><circle cx="638" cy="134" r="4"/>
    </g>
    <circle cx="646" cy="112" r="54" fill="none" stroke="#ffffff" stroke-width="1" opacity=".4"/>
  </g>

  <!-- 远山 -->
  <path d="M0 420 L 110 340 L 196 404 L 262 352 L 360 424 L 452 366 L 546 424 L 640 372 L 740 428 L 800 396 V600 H0 Z" fill="#0b1a2b"/>
  <path d="M0 420 L 110 340 L 196 404 L 262 352 L 360 424" fill="none" stroke="#3d6482" stroke-width="1.2" opacity=".7"/>

  <!-- 城市暖光 -->
  <ellipse cx="400" cy="440" rx="230" ry="80" fill="#ffbf6b" opacity=".13" filter="url(#soft)"/>

  <!-- 贝洛伯格 -->
  <g>
    <rect x="196" y="414" width="120" height="66" fill="url(#tower)" stroke="#6f88a8" stroke-width="1"/>
    <rect x="524" y="408" width="118" height="72" fill="url(#tower)" stroke="#6f88a8" stroke-width="1"/>
    <rect x="318" y="382" width="76" height="98" fill="#16243a" stroke="#6f88a8" stroke-width="1"/>
    <rect x="440" y="392" width="70" height="88" fill="#16243a" stroke="#6f88a8" stroke-width="1"/>

    <path d="M360 330 L 400 254 L 440 330 Z" fill="url(#tower)" stroke="#8fa9c9" stroke-width="1.2"/>
    <path d="M400 254 V 214" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="400" cy="208" r="7" fill="#ffe3a3" filter="url(#glow)"/>
    <rect x="352" y="330" width="96" height="152" fill="#1a2a42" stroke="#8fa9c9" stroke-width="1.2"/>

    <path d="M196 414 Q 256 392 316 414" fill="none" stroke="#8fa9c9" stroke-width="1.2"/>
    <path d="M524 408 Q 583 386 642 408" fill="none" stroke="#8fa9c9" stroke-width="1.2"/>

    <g fill="#ffd08a">
      <rect x="212" y="428" width="8" height="12"/><rect x="232" y="428" width="8" height="12"/>
      <rect x="252" y="428" width="8" height="12"/><rect x="272" y="428" width="8" height="12"/>
      <rect x="292" y="428" width="8" height="12"/>
      <rect x="540" y="424" width="8" height="12"/><rect x="560" y="424" width="8" height="12"/>
      <rect x="580" y="424" width="8" height="12"/><rect x="600" y="424" width="8" height="12"/>
      <rect x="620" y="424" width="8" height="12"/>
      <rect x="330" y="400" width="7" height="14"/><rect x="352" y="400" width="7" height="14"/>
      <rect x="374" y="400" width="7" height="14"/><rect x="396" y="400" width="7" height="14"/>
      <rect x="418" y="400" width="7" height="14"/><rect x="440" y="400" width="7" height="14"/>
      <rect x="452" y="418" width="7" height="14"/><rect x="474" y="418" width="7" height="14"/>
      <rect x="496" y="418" width="7" height="14"/>
      <rect x="376" y="440" width="48" height="42" fill="#ffcf87" opacity=".9"/>
    </g>
    <path d="M376 482 V 452 Q 400 436 424 452 V 482 Z" fill="#0d1826" opacity=".55"/>
  </g>

  <!-- 雪地 -->
  <path d="M0 470 Q 140 444 300 468 T 620 462 T 800 452 V600 H0 Z" fill="url(#snow)" opacity=".92"/>
  <path d="M0 516 Q 180 484 360 512 T 800 496 V600 H0 Z" fill="#e8f3fb" opacity=".55"/>
  <path d="M0 560 Q 200 536 420 556 T 800 544 V600 H0 Z" fill="#16283c"/>
  <path d="M0 560 Q 200 536 420 556 T 800 544" fill="none" stroke="#8fb6d2" stroke-width="1.4" opacity=".6"/>

  <g fill="#ffffff" opacity=".75">
    <circle cx="80" cy="300" r="1.6"/><circle cx="150" cy="352" r="1.2"/><circle cx="230" cy="294" r="1.4"/>
    <circle cx="310" cy="340" r="1.1"/><circle cx="392" cy="306" r="1.5"/><circle cx="470" cy="352" r="1.2"/>
    <circle cx="548" cy="312" r="1.4"/><circle cx="628" cy="360" r="1.1"/><circle cx="706" cy="318" r="1.5"/>
    <circle cx="760" cy="392" r="1.2"/><circle cx="122" cy="430" r="1.3"/><circle cx="678" cy="436" r="1.1"/>
  </g>
</svg>
