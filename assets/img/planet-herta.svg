<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="黑塔空间站插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060e"/>
      <stop offset=".55" stop-color="#081426"/>
      <stop offset="1" stop-color="#0b1f33"/>
    </linearGradient>
    <radialGradient id="neb" cx=".25" cy=".25" r=".8">
      <stop offset="0" stop-color="#2fd4e0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#d8feff"/>
      <stop offset=".45" stop-color="#59c9e6"/>
      <stop offset="1" stop-color="#134a63"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5836"/>
      <stop offset=".35" stop-color="#ffe3a3"/>
      <stop offset=".65" stop-color="#9ad9e8"/>
      <stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="mod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46527a"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c5c86"/>
      <stop offset="1" stop-color="#0a1524"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#neb)"/>

  <g fill="#ffffff">
    <circle cx="52" cy="60" r="1.4" opacity=".8"/><circle cx="118" cy="124" r="1" opacity=".5"/>
    <circle cx="188" cy="46" r="1.2" opacity=".65"/><circle cx="246" cy="96" r="1.6" opacity=".8"/>
    <circle cx="322" cy="38" r="1" opacity=".5"/><circle cx="404" cy="88" r="1.2" opacity=".6"/>
    <circle cx="470" cy="42" r="1.5" opacity=".75"/><circle cx="548" cy="112" r="1" opacity=".45"/>
    <circle cx="612" cy="58" r="1.3" opacity=".65"/><circle cx="690" cy="146" r="1.1" opacity=".55"/>
    <circle cx="742" cy="70" r="1.6" opacity=".8"/><circle cx="772" cy="210" r="1" opacity=".45"/>
    <circle cx="86" cy="214" r="1.2" opacity=".5"/><circle cx="152" cy="300" r="1" opacity=".4"/>
    <circle cx="700" cy="300" r="1.3" opacity=".5"/><circle cx="748" cy="420" r="1" opacity=".4"/>
    <circle cx="60" cy="420" r="1.1" opacity=".45"/><circle cx="120" cy="500" r="1" opacity=".35"/>
  </g>

  <g opacity=".8">
    <circle cx="672" cy="120" r="86" fill="url(#far)"/>
    <path d="M586 120 A 86 86 0 0 0 758 120" fill="#0a1220" opacity=".55"/>
    <ellipse cx="672" cy="126" rx="126" ry="26" fill="none" stroke="#6f8fc0" stroke-width="2" opacity=".5" transform="rotate(-12 672 126)"/>
  </g>

  <g filter="url(#soft)" opacity=".55">
    <ellipse cx="380" cy="330" rx="200" ry="120" fill="#2fb6c9"/>
  </g>

  <!-- 外环 -->
  <g transform="rotate(-16 380 320)">
    <ellipse cx="380" cy="320" rx="246" ry="82" fill="none" stroke="url(#ring)" stroke-width="9"/>
    <ellipse cx="380" cy="320" rx="246" ry="82" fill="none" stroke="#ffe3a3" stroke-width="1.6" opacity=".8"/>
    <ellipse cx="380" cy="320" rx="214" ry="66" fill="none" stroke="#7fd8e8" stroke-width="1" opacity=".45"/>
  </g>

  <!-- 中央核心 -->
  <circle cx="380" cy="320" r="94" fill="url(#core)"/>
  <g fill="none" stroke="#0b3140" stroke-width="1" opacity=".45">
    <ellipse cx="380" cy="320" rx="94" ry="30"/>
    <ellipse cx="380" cy="320" rx="94" ry="62"/>
    <ellipse cx="380" cy="320" rx="30" ry="94"/>
    <ellipse cx="380" cy="320" rx="62" ry="94"/>
    <circle cx="380" cy="320" r="94"/>
  </g>
  <circle cx="380" cy="320" r="94" fill="none" stroke="#e8ffff" stroke-width="1.4" opacity=".7"/>

  <!-- 支撑臂 -->
  <g stroke="#8fa6cf" stroke-width="3" opacity=".8">
    <path d="M380 320 L 176 254"/><path d="M380 320 L 584 254"/>
    <path d="M380 320 L 208 404"/><path d="M380 320 L 556 404"/>
    <path d="M380 320 L 300 226"/><path d="M380 320 L 462 420"/>
  </g>

  <!-- 模块 -->
  <g>
    <g fill="url(#mod)" stroke="#9fb4dc" stroke-width="1.2">
      <rect x="142" y="240" width="66" height="30" rx="6" transform="rotate(-14 175 255)"/>
      <rect x="552" y="238" width="70" height="30" rx="6" transform="rotate(14 587 253)"/>
      <rect x="176" y="392" width="62" height="26" rx="6" transform="rotate(20 207 405)"/>
      <rect x="562" y="390" width="58" height="26" rx="6" transform="rotate(-20 591 403)"/>
      <rect x="470" y="176" width="46" height="24" rx="5"/>
      <rect x="262" y="446" width="46" height="22" rx="5"/>
    </g>
    <g fill="#ffe3a3">
      <circle cx="158" cy="248" r="3"/><circle cx="176" cy="251" r="3"/><circle cx="194" cy="254" r="3"/>
      <circle cx="570" cy="246" r="3"/><circle cx="588" cy="250" r="3"/><circle cx="606" cy="254" r="3"/>
      <circle cx="192" cy="400" r="2.6"/><circle cx="210" cy="406" r="2.6"/>
      <circle cx="576" cy="398" r="2.6"/><circle cx="592" cy="392" r="2.6"/>
      <circle cx="484" cy="188" r="2.4"/><circle cx="504" cy="188" r="2.4"/>
    </g>
  </g>

  <!-- 小飞行器 -->
  <g fill="#cfe9ff" opacity=".9">
    <path d="M640 486 l16 6 -16 6 -4 -6 Z"/>
    <path d="M92 178 l12 5 -12 5 -3 -5 Z"/>
  </g>
  <g stroke="#62e0ff" stroke-width="1.4" opacity=".55">
    <path d="M656 492 H 720"/><path d="M104 183 H 46"/>
  </g>

  <!-- 前景平台 -->
  <path d="M0 600 V 520 Q 120 500 240 522 L 300 600 Z" fill="#05070e"/>
  <path d="M0 520 Q 120 500 240 522" fill="none" stroke="#40506f" stroke-width="1.4" opacity=".6"/>
  <g fill="#ffe3a3" opacity=".8">
    <circle cx="60" cy="536" r="2"/><circle cx="104" cy="528" r="2"/><circle cx="150" cy="522" r="2"/>
  </g>
</svg>
