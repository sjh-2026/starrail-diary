<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="匹诺康尼梦境之城插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150722"/>
      <stop offset=".42" stop-color="#3b1440"/>
      <stop offset=".72" stop-color="#8a3a55"/>
      <stop offset="1" stop-color="#e0a06a"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff6dd"/>
      <stop offset=".55" stop-color="#ffd79a"/>
      <stop offset="1" stop-color="#e08a52"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1b34"/>
      <stop offset="1" stop-color="#120611"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a672c"/>
      <stop offset=".5" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#8a672c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <g fill="#fff4e2">
    <circle cx="70" cy="66" r="1.2" opacity=".7"/><circle cx="136" cy="112" r="1" opacity=".45"/>
    <circle cx="200" cy="42" r="1.4" opacity=".65"/><circle cx="266" cy="96" r="1" opacity=".4"/>
    <circle cx="330" cy="56" r="1.2" opacity=".55"/><circle cx="96" cy="190" r="1" opacity=".4"/>
    <circle cx="740" cy="70" r="1.3" opacity=".6"/><circle cx="700" cy="140" r="1" opacity=".45"/>
    <circle cx="60" cy="280" r="1.2" opacity=".45"/><circle cx="770" cy="260" r="1" opacity=".4"/>
  </g>

  <g filter="url(#soft)" opacity=".55">
    <ellipse cx="600" cy="200" rx="180" ry="120" fill="#ffb066"/>
  </g>

  <circle cx="572" cy="196" r="112" fill="url(#moon)"/>
  <g fill="#d9945f" opacity=".35">
    <circle cx="540" cy="170" r="14"/><circle cx="600" cy="214" r="9"/><circle cx="560" cy="240" r="6"/>
  </g>
  <circle cx="572" cy="196" r="112" fill="none" stroke="#fff6dd" stroke-width="1" opacity=".5"/>
  <circle cx="572" cy="196" r="132" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".5" stroke-dasharray="3 9"/>

  <!-- 梦境云 -->
  <g filter="url(#soft)" opacity=".5">
    <ellipse cx="200" cy="420" rx="240" ry="46" fill="#ff9f8a"/>
    <ellipse cx="620" cy="440" rx="220" ry="40" fill="#c486d8"/>
  </g>

  <!-- 悬浮纸牌 -->
  <g stroke="url(#gold)" stroke-width="1.4" opacity=".9">
    <rect x="150" y="250" width="40" height="58" rx="4" fill="#2a1026" transform="rotate(-16 170 279)"/>
    <rect x="600" y="330" width="34" height="50" rx="4" fill="#2a1026" transform="rotate(14 617 355)"/>
  </g>
  <g fill="#ffe3a3" opacity=".9">
    <path d="M168 268 l8 12 -8 12 -8 -12 Z" transform="rotate(-16 168 280)"/>
    <path d="M616 344 l6 10 -6 10 -6 -10 Z" transform="rotate(14 616 354)"/>
  </g>

  <!-- 五线谱 -->
  <g stroke="#ffe3a3" stroke-width=".9" fill="none" opacity=".28">
    <path d="M40 350 C 200 300 320 372 480 330 S 720 300 800 330"/>
    <path d="M40 360 C 200 310 320 382 480 340 S 720 310 800 340"/>
    <path d="M40 370 C 200 320 320 392 480 350 S 720 320 800 350"/>
  </g>

  <!-- 城市 -->
  <g>
    <path d="M0 520 H 800 V 600 H 0 Z" fill="#0d040e"/>
    <!-- 中央酒店 -->
    <path d="M330 520 V 300 H 470 V 520 Z" fill="url(#tower)" stroke="#8a5a3c" stroke-width="1.4"/>
    <path d="M330 300 Q 400 250 470 300 Z" fill="#2a1026" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M400 250 V 214" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="400" cy="208" r="8" fill="#ffe3a3" filter="url(#glow)"/>
    <rect x="354" y="330" width="92" height="14" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
    <g fill="#ffcf87">
      <rect x="352" y="372" width="12" height="26"/><rect x="378" y="372" width="12" height="26"/>
      <rect x="404" y="372" width="12" height="26"/><rect x="430" y="372" width="12" height="26"/>
      <rect x="352" y="418" width="12" height="26"/><rect x="378" y="418" width="12" height="26"/>
      <rect x="404" y="418" width="12" height="26"/><rect x="430" y="418" width="12" height="26"/>
    </g>
    <path d="M368 520 V 470 Q 400 448 432 470 V 520 Z" fill="#1b0716" stroke="url(#gold)" stroke-width="1.4"/>

    <!-- 侧楼 -->
    <path d="M120 520 V 392 H 232 V 520 Z" fill="url(#tower)" stroke="#7c4c38" stroke-width="1.2"/>
    <path d="M120 392 Q 176 356 232 392 Z" fill="#2a1026" stroke="url(#gold)" stroke-width="1.4"/>
    <g fill="#ffcf87" opacity=".9">
      <rect x="140" y="420" width="10" height="18"/><rect x="166" y="420" width="10" height="18"/>
      <rect x="192" y="420" width="10" height="18"/><rect x="140" y="462" width="10" height="18"/>
      <rect x="166" y="462" width="10" height="18"/><rect x="192" y="462" width="10" height="18"/>
    </g>

    <path d="M560 520 V 420 H 660 V 520 Z" fill="url(#tower)" stroke="#7c4c38" stroke-width="1.2"/>
    <path d="M560 420 Q 610 390 660 420 Z" fill="#2a1026" stroke="url(#gold)" stroke-width="1.4"/>
    <g fill="#ffcf87" opacity=".9">
      <rect x="580" y="446" width="10" height="18"/><rect x="606" y="446" width="10" height="18"/>
      <rect x="632" y="446" width="10" height="18"/>
    </g>

    <!-- 拱门 -->
    <g fill="none" stroke="url(#gold)" stroke-width="1.6" opacity=".8">
      <path d="M700 520 V 470 Q 700 440 730 440 Q 760 440 760 470 V 520"/>
      <path d="M250 520 V 486 Q 250 466 270 466 Q 290 466 290 486 V 520"/>
    </g>
  </g>

  <!-- 台阶 -->
  <g fill="#150712" stroke="#6d422f" stroke-width="1">
    <path d="M0 556 H 800 V 570 H 0 Z"/>
    <path d="M0 574 H 800 V 588 H 0 Z"/>
    <path d="M0 592 H 800 V 600 H 0 Z"/>
  </g>

  <!-- 星屑 -->
  <g fill="#ffe3a3">
    <circle cx="300" cy="180" r="2" opacity=".9"/><circle cx="470" cy="140" r="1.5" opacity=".8"/>
    <circle cx="680" cy="300" r="2" opacity=".8"/><circle cx="220" cy="330" r="1.4" opacity=".7"/>
    <circle cx="120" cy="200" r="1.6" opacity=".7"/><circle cx="520" cy="420" r="1.4" opacity=".6"/>
  </g>
</svg>
