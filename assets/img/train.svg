<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="星穹列车驶过星海">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050d"/>
      <stop offset=".55" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#150f33"/>
    </linearGradient>
    <radialGradient id="neb" cx=".28" cy=".18" r=".85">
      <stop offset="0" stop-color="#7a63ea" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#3d2f96" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx=".82" cy=".75" r=".6">
      <stop offset="0" stop-color="#2fb6c9" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46507a"/>
      <stop offset=".42" stop-color="#232a44"/>
      <stop offset="1" stop-color="#0e1220"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39415f"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a672c"/>
      <stop offset=".45" stop-color="#f6e2b0"/>
      <stop offset=".7" stop-color="#d8b268"/>
      <stop offset="1" stop-color="#8a672c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6fbff"/>
      <stop offset=".55" stop-color="#6fd8f2"/>
      <stop offset="1" stop-color="#2a87ad"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe3a3" stop-opacity=".7"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#sky)"/>
  <rect width="1000" height="420" fill="url(#neb)"/>
  <rect width="1000" height="420" fill="url(#neb2)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="52" r="1.6" opacity=".9"/><circle cx="128" cy="118" r="1" opacity=".55"/>
    <circle cx="196" cy="40" r="1.2" opacity=".7"/><circle cx="252" cy="96" r="1.8" opacity=".85"/>
    <circle cx="330" cy="44" r="1" opacity=".5"/><circle cx="392" cy="128" r="1.4" opacity=".65"/>
    <circle cx="470" cy="60" r="1.1" opacity=".6"/><circle cx="540" cy="30" r="1.7" opacity=".8"/>
    <circle cx="604" cy="104" r="1" opacity=".5"/><circle cx="668" cy="46" r="1.3" opacity=".7"/>
    <circle cx="742" cy="120" r="1.7" opacity=".85"/><circle cx="812" cy="36" r="1" opacity=".5"/>
    <circle cx="880" cy="92" r="1.4" opacity=".7"/><circle cx="946" cy="58" r="1.1" opacity=".6"/>
    <circle cx="98" cy="196" r="1" opacity=".45"/><circle cx="300" cy="170" r="1.2" opacity=".5"/>
    <circle cx="520" cy="160" r="1" opacity=".4"/><circle cx="700" cy="180" r="1.3" opacity=".55"/>
    <circle cx="884" cy="188" r="1" opacity=".45"/><circle cx="960" cy="150" r="1.5" opacity=".7"/>
  </g>

  <g opacity=".7" filter="url(#soft)" fill="#9f8bff">
    <ellipse cx="200" cy="90" rx="150" ry="46"/>
  </g>

  <g stroke="url(#trail)" stroke-linecap="round" fill="none">
    <path d="M-40 232 H150" stroke-width="2" opacity=".55"/>
    <path d="M-40 252 H130" stroke-width="1.2" opacity=".4"/>
    <path d="M-40 272 H170" stroke-width="3" opacity=".3"/>
    <path d="M-40 290 H120" stroke-width="1" opacity=".5"/>
  </g>

  <!-- 星轨 -->
  <g fill="none" stroke-linecap="round">
    <path d="M-20 360 C 220 334 420 366 620 340 S 880 318 1020 334" stroke="url(#gold)" stroke-width="2.4"/>
    <path d="M-20 374 C 220 348 420 380 620 354 S 880 332 1020 348" stroke="#6c5836" stroke-width="1.2" opacity=".7"/>
  </g>
  <g stroke="#ffe3a3" stroke-width="1.4" opacity=".55" stroke-dasharray="14 18">
    <path d="M-20 367 C 220 341 420 373 620 347 S 880 325 1020 341"/>
  </g>

  <!-- 车厢 -->
  <g>
    <path d="M18 238 Q18 216 42 216 H150 Q166 216 166 232 V286 Q166 296 154 296 H34 Q18 296 18 280 Z" fill="url(#car)" stroke="#5f6a92" stroke-width="1.4"/>
    <rect x="18" y="248" width="148" height="3" fill="url(#gold)" opacity=".85"/>
    <g fill="url(#glass)" opacity=".9">
      <rect x="36" y="232" width="26" height="22" rx="4"/>
      <rect x="74" y="232" width="26" height="22" rx="4"/>
      <rect x="112" y="232" width="26" height="22" rx="4"/>
    </g>
    <rect x="18" y="284" width="148" height="10" fill="#0a0d16"/>
    <circle cx="52" cy="306" r="18" fill="#151a28" stroke="#c9a865" stroke-width="2"/>
    <circle cx="52" cy="306" r="6" fill="#e6c27a"/>
    <circle cx="136" cy="306" r="18" fill="#151a28" stroke="#c9a865" stroke-width="2"/>
    <circle cx="136" cy="306" r="6" fill="#e6c27a"/>
    <path d="M166 272 H196" stroke="#8d97bd" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 车头 -->
  <g>
    <path d="M196 292 V252 Q196 198 250 198 H648 Q734 198 776 228 Q806 250 786 272 L758 294 Z" fill="url(#hull)" stroke="#6b77a5" stroke-width="1.6"/>
    <path d="M196 214 H648 Q716 214 752 236" fill="none" stroke="url(#gold)" stroke-width="2.6" opacity=".9"/>
    <path d="M200 286 H752" stroke="url(#gold)" stroke-width="3" opacity=".9"/>
    <path d="M196 292 V252 Q196 240 208 236 V292 Z" fill="#0b0e18" opacity=".6"/>

    <!-- 烟囱 -->
    <path d="M236 198 V150 H266 V198 Z" fill="#1a2033" stroke="#7d88b3" stroke-width="1.4"/>
    <path d="M226 152 H276 L268 134 H234 Z" fill="url(#gold)"/>
    <rect x="232" y="160" width="38" height="6" rx="3" fill="url(#gold)" opacity=".9"/>
    <ellipse cx="251" cy="128" rx="30" ry="12" fill="#9f8bff" opacity=".35" filter="url(#soft)"/>

    <!-- 穹顶 -->
    <path d="M332 198 Q332 166 360 166 Q388 166 388 198 Z" fill="#2a3350" stroke="url(#gold)" stroke-width="1.6"/>

    <!-- 驾驶室窗 -->
    <rect x="212" y="216" width="66" height="44" rx="6" fill="url(#glass)" opacity=".95" filter="url(#glow)"/>
    <rect x="212" y="216" width="66" height="44" rx="6" fill="none" stroke="#8b6a35" stroke-width="2"/>

    <!-- 舷窗 -->
    <g>
      <circle cx="340" cy="238" r="17" fill="url(#glass)" filter="url(#glow)"/>
      <circle cx="404" cy="238" r="17" fill="url(#glass)" filter="url(#glow)"/>
      <circle cx="468" cy="238" r="17" fill="url(#glass)" filter="url(#glow)"/>
      <circle cx="532" cy="238" r="17" fill="url(#glass)"/>
      <circle cx="596" cy="238" r="17" fill="url(#glass)"/>
      <circle cx="660" cy="238" r="17" fill="url(#glass)"/>
      <g fill="none" stroke="#8b6a35" stroke-width="2">
        <circle cx="340" cy="238" r="17"/><circle cx="404" cy="238" r="17"/>
        <circle cx="468" cy="238" r="17"/><circle cx="532" cy="238" r="17"/>
        <circle cx="596" cy="238" r="17"/><circle cx="660" cy="238" r="17"/>
      </g>
    </g>

    <!-- 车头灯 -->
    <circle cx="762" cy="252" r="13" fill="#fff6dc" filter="url(#glow)"/>
    <circle cx="762" cy="252" r="7" fill="#ffe3a3"/>

    <!-- 轮组 -->
    <g>
      <circle cx="252" cy="306" r="30" fill="#12161f" stroke="#c9a865" stroke-width="2.6"/>
      <circle cx="252" cy="306" r="10" fill="#e6c27a"/>
      <circle cx="404" cy="306" r="30" fill="#12161f" stroke="#c9a865" stroke-width="2.6"/>
      <circle cx="404" cy="306" r="10" fill="#e6c27a"/>
      <circle cx="580" cy="306" r="30" fill="#12161f" stroke="#c9a865" stroke-width="2.6"/>
      <circle cx="580" cy="306" r="10" fill="#e6c27a"/>
      <circle cx="704" cy="306" r="22" fill="#12161f" stroke="#c9a865" stroke-width="2.4"/>
      <circle cx="704" cy="306" r="7" fill="#e6c27a"/>
      <g stroke="#8b6a35" stroke-width="2" opacity=".8">
        <path d="M252 276 V336 M222 306 H282"/><path d="M404 276 V336 M374 306 H434"/>
        <path d="M580 276 V336 M550 306 H610"/>
      </g>
    </g>

    <path d="M196 264 H760" stroke="#4b5578" stroke-width="1" opacity=".8"/>
  </g>

  <!-- 车灯光束 -->
  <path d="M772 246 L1000 214 L1000 286 L772 262 Z" fill="#ffe3a3" opacity=".07" filter="url(#soft)"/>

  <!-- 前景 -->
  <path d="M0 400 Q180 372 360 392 T740 384 T1000 396 V420 H0 Z" fill="#05060c"/>
</svg>
