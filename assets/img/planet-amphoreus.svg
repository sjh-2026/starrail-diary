<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="翁法罗斯黄金之城插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb6d4"/>
      <stop offset=".45" stop-color="#dfe6dc"/>
      <stop offset=".78" stop-color="#f6e3c2"/>
      <stop offset="1" stop-color="#e8c79a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".55" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#f0b667"/>
    </radialGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset=".55" stop-color="#efe4cd"/>
      <stop offset="1" stop-color="#cbb894"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a37d38"/>
      <stop offset=".5" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#a37d38"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <g filter="url(#soft)" opacity=".85">
    <ellipse cx="400" cy="238" rx="150" ry="150" fill="#ffe9b8"/>
  </g>

  <g transform="translate(400 236)" stroke="#f0c47a" stroke-width="2.4" opacity=".75" stroke-linecap="round">
    <path d="M0 -104 V -128"/><path d="M0 104 V 128"/>
    <path d="M-104 0 H -128"/><path d="M104 0 H 128"/>
    <path d="M-74 -74 L -90 -90"/><path d="M74 74 L 90 90"/>
    <path d="M74 -74 L 90 -90"/><path d="M-74 74 L -90 90"/>
    <path d="M-40 -97 L -47 -118"/><path d="M40 -97 L 47 -118"/>
    <path d="M-40 97 L -47 118"/><path d="M40 97 L 47 118"/>
    <path d="M-97 -40 L -118 -47"/><path d="M-97 40 L -118 47"/>
    <path d="M97 -40 L 118 -47"/><path d="M97 40 L 118 47"/>
  </g>
  <circle cx="400" cy="236" r="86" fill="url(#sun)"/>
  <circle cx="400" cy="236" r="86" fill="none" stroke="#fffdf2" stroke-width="2" opacity=".8"/>

  <g fill="#ffffff" opacity=".65" filter="url(#soft)">
    <ellipse cx="150" cy="120" rx="90" ry="22"/>
    <ellipse cx="660" cy="90" rx="110" ry="20"/>
    <ellipse cx="700" cy="300" rx="70" ry="16"/>
  </g>

  <g stroke="#5c7f96" stroke-width="1.8" fill="none" opacity=".7" stroke-linecap="round">
    <path d="M110 200 q 12 -12 24 0 q 12 -12 24 0"/>
    <path d="M590 170 q 10 -10 20 0 q 10 -10 20 0"/>
    <path d="M240 260 q 8 -8 16 0 q 8 -8 16 0"/>
  </g>

  <!-- 神殿 -->
  <g>
    <path d="M270 330 L 400 268 L 530 330 Z" fill="url(#marble)" stroke="url(#gold)" stroke-width="2"/>
    <path d="M300 322 L 400 274 L 500 322" fill="none" stroke="#b99a5f" stroke-width="1" opacity=".8"/>
    <circle cx="400" cy="316" r="10" fill="url(#gold)" opacity=".9"/>

    <rect x="268" y="330" width="264" height="24" fill="url(#marble)" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M268 354 H 532" stroke="#b99a5f" stroke-width="1"/>

    <g>
      <rect x="284" y="354" width="20" height="118" fill="url(#marble)" stroke="#b99a5f" stroke-width="1"/>
      <rect x="340" y="354" width="20" height="118" fill="url(#marble)" stroke="#b99a5f" stroke-width="1"/>
      <rect x="396" y="354" width="20" height="118" fill="url(#marble)" stroke="#b99a5f" stroke-width="1"/>
      <rect x="452" y="354" width="20" height="118" fill="url(#marble)" stroke="#b99a5f" stroke-width="1"/>
      <rect x="496" y="354" width="20" height="118" fill="url(#marble)" stroke="#b99a5f" stroke-width="1"/>
      <g fill="url(#gold)" opacity=".85">
        <rect x="280" y="350" width="28" height="7"/><rect x="336" y="350" width="28" height="7"/>
        <rect x="392" y="350" width="28" height="7"/><rect x="448" y="350" width="28" height="7"/>
        <rect x="492" y="350" width="28" height="7"/>
        <rect x="280" y="466" width="28" height="7"/><rect x="336" y="466" width="28" height="7"/>
        <rect x="392" y="466" width="28" height="7"/><rect x="448" y="466" width="28" height="7"/>
        <rect x="492" y="466" width="28" height="7"/>
      </g>
    </g>

    <rect x="360" y="380" width="80" height="92" fill="#4a3a2a" opacity=".55"/>
    <path d="M360 380 Q 400 344 440 380" fill="none" stroke="url(#gold)" stroke-width="2"/>

    <rect x="250" y="472" width="300" height="18" fill="url(#marble)" stroke="#b99a5f" stroke-width="1.2"/>
    <rect x="228" y="490" width="344" height="18" fill="url(#marble)" stroke="#b99a5f" stroke-width="1.2"/>
    <rect x="206" y="508" width="388" height="20" fill="#e4d3b3" stroke="#b99a5f" stroke-width="1.2"/>
  </g>

  <!-- 月桂 -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" opacity=".8">
    <path d="M126 528 q 60 -34 128 -12"/>
    <path d="M674 528 q -60 -34 -128 -12"/>
  </g>
  <g fill="#a37d38" opacity=".8">
    <ellipse cx="152" cy="514" rx="10" ry="5" transform="rotate(-28 152 514)"/>
    <ellipse cx="182" cy="504" rx="10" ry="5" transform="rotate(-16 182 504)"/>
    <ellipse cx="214" cy="500" rx="10" ry="5" transform="rotate(-8 214 500)"/>
    <ellipse cx="246" cy="502" rx="10" ry="5" transform="rotate(4 246 502)"/>
    <ellipse cx="648" cy="514" rx="10" ry="5" transform="rotate(28 648 514)"/>
    <ellipse cx="618" cy="504" rx="10" ry="5" transform="rotate(16 618 504)"/>
    <ellipse cx="586" cy="500" rx="10" ry="5" transform="rotate(8 586 500)"/>
    <ellipse cx="554" cy="502" rx="10" ry="5" transform="rotate(-4 554 502)"/>
  </g>

  <!-- 地面 -->
  <path d="M0 528 H 800 V 600 H 0 Z" fill="#d9c3a0"/>
  <path d="M0 528 H 800 V 548 H 0 Z" fill="#c9ae86" opacity=".8"/>
  <path d="M0 570 H 800 V 600 H 0 Z" fill="#b89a72" opacity=".55"/>
  <g stroke="#a8895f" stroke-width="1" opacity=".5">
    <path d="M120 548 V 600"/><path d="M300 548 V 600"/><path d="M500 548 V 600"/><path d="M680 548 V 600"/>
  </g>
</svg>
